    <g stroke="#60a5fa" stroke-width="13" transform="translate(694 790)">
      <path d="M0 91V55h27v36M50 91V33h27v58M100 91V5h27v86"/>
      <path d="M-3 20l42-28 35 11 53-45"/>
    </g>
